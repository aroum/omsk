name: Build Firmware

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [omsk_fm, omsk_wave, omsk_grain, omsk_midi, omsk_oled_test]
        platform: [rp2040, rp2350]
        audio: [pwm, dac]
        display: [ssd1312, sh1107]
        exclude:
          - firmware: omsk_wave
            platform: rp2040
          - firmware: omsk_midi
            audio: dac
          - firmware: omsk_oled_test
            audio: dac

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build

      - name: Checkout Pico SDK
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.0
          path: pico-sdk
          submodules: recursive

      - name: Set Board & SDK Environment
        run: |
          echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> $GITHUB_ENV
          if [ "${{ matrix.platform }}" = "rp2040" ]; then
            echo "PICO_BOARD=pico" >> $GITHUB_ENV
          else
            echo "PICO_BOARD=pico2" >> $GITHUB_ENV
          fi

      - name: Build ${{ matrix.firmware }} (${{ matrix.platform }}, ${{ matrix.audio }}, ${{ matrix.display }})
        run: |
          cd firmware/${{ matrix.firmware }}
          mkdir -p build
          cd build

          EXTRA_FLAGS=""
          if [ "${{ matrix.display }}" = "sh1107" ]; then
            EXTRA_FLAGS="-DCFG_OLED_TYPE=1"
          else
            EXTRA_FLAGS="-DCFG_OLED_TYPE=0"
          fi

          if [ "${{ matrix.firmware }}" = "omsk_grain" ]; then
            if [ "${{ matrix.audio }}" = "dac" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DAUDIO_OUT_DAC=1"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DAUDIO_OUT_PWM=1"
            fi
          elif [ "${{ matrix.firmware }}" = "omsk_fm" ] || [ "${{ matrix.firmware }}" = "omsk_wave" ]; then
            if [ "${{ matrix.audio }}" = "dac" ]; then
              EXTRA_FLAGS="$EXTRA_FLAGS -DCFG_ENABLE_DAC=1 -DCFG_ENABLE_PWM8_AUDIO=0"
            else
              EXTRA_FLAGS="$EXTRA_FLAGS -DCFG_ENABLE_DAC=0 -DCFG_ENABLE_PWM8_AUDIO=1"
            fi
          fi

          cmake -G Ninja -DPICO_PLATFORM=${{ matrix.platform }} -DPICO_BOARD=${{ env.PICO_BOARD }} $EXTRA_FLAGS ..
          ninja

          # Rename binaries to include audio output source and display name
          SUFFIX="${{ matrix.platform }}_${{ matrix.audio }}_${{ matrix.display }}"
          for ext in uf2 bin elf; do
            if [ -f "${{ matrix.firmware }}.${ext}" ]; then
              cp "${{ matrix.firmware }}.${ext}" "${{ matrix.firmware }}_${SUFFIX}.${ext}"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.firmware }}_${{ matrix.platform }}_${{ matrix.audio }}_${{ matrix.display }}
          path: |
            firmware/${{ matrix.firmware }}/build/*_${{ matrix.platform }}_${{ matrix.audio }}_${{ matrix.display }}.uf2
            firmware/${{ matrix.firmware }}/build/*_${{ matrix.platform }}_${{ matrix.audio }}_${{ matrix.display }}.bin
            firmware/${{ matrix.firmware }}/build/*_${{ matrix.platform }}_${{ matrix.audio }}_${{ matrix.display }}.elf

  release:
    name: Create & Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/firmware

      - name: Prepare Release Package
        run: |
          mkdir -p dist

          # 1. Copy all compiled firmware binaries (.uf2, .bin)
          find release_assets/firmware -type f \( -name "*.uf2" -o -name "*.bin" \) -exec cp {} dist/ \;

          # 2. Package hardware/case into case.zip
          if [ -d "hardware/case" ]; then
            cd hardware/case
            zip -r ../../dist/case.zip .
            cd ../..
          fi

          # 3. Locate Gerber zip in hardware/pcb/ or pack hardware/pcb files
          GERBER_ZIP=$(find hardware/pcb -maxdepth 1 -iname "*gerber*.zip" | head -n 1)
          if [ -n "$GERBER_ZIP" ]; then
            cp "$GERBER_ZIP" dist/
          else
            cd hardware/pcb
            zip -r ../../dist/omsk-pcb-gerber.zip .
            cd ../..
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
