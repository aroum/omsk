name: Build Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [omsk_fm, omsk_wave, omsk_grain, omsk_midi, omsk_oled_test]
        platform: [rp2040, rp2350]
        audio: [pwm, dac]
        exclude:
          - firmware: omsk_wave
            platform: rp2040
          - firmware: omsk_midi
            audio: dac
          - firmware: omsk_oled_test
            audio: dac

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ARM Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake ninja-build

      - name: Checkout Pico SDK
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.0
          path: pico-sdk
          submodules: recursive

      - name: Set Board & SDK Environment
        run: |
          echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> $GITHUB_ENV
          if [ "${{ matrix.platform }}" = "rp2040" ]; then
            echo "PICO_BOARD=pico" >> $GITHUB_ENV
          else
            echo "PICO_BOARD=pico2" >> $GITHUB_ENV
          fi

      - name: Build ${{ matrix.firmware }} (${{ matrix.platform }}, ${{ matrix.audio }})
        run: |
          cd firmware/${{ matrix.firmware }}
          mkdir -p build
          cd build

          EXTRA_FLAGS=""
          if [ "${{ matrix.firmware }}" = "omsk_grain" ]; then
            if [ "${{ matrix.audio }}" = "dac" ]; then
              EXTRA_FLAGS="-DAUDIO_OUT_DAC=1"
            else
              EXTRA_FLAGS="-DAUDIO_OUT_PWM=1"
            fi
          elif [ "${{ matrix.firmware }}" = "omsk_fm" ] || [ "${{ matrix.firmware }}" = "omsk_wave" ]; then
            if [ "${{ matrix.audio }}" = "dac" ]; then
              EXTRA_FLAGS="-DCFG_ENABLE_DAC=1 -DCFG_ENABLE_PWM8_AUDIO=0"
            else
              EXTRA_FLAGS="-DCFG_ENABLE_DAC=0 -DCFG_ENABLE_PWM8_AUDIO=1"
            fi
          fi

          cmake -G Ninja -DPICO_PLATFORM=${{ matrix.platform }} -DPICO_BOARD=${{ env.PICO_BOARD }} $EXTRA_FLAGS ..
          ninja

          # Rename binaries to include audio output source name
          SUFFIX="${{ matrix.platform }}_${{ matrix.audio }}"
          for ext in uf2 bin elf; do
            if [ -f "${{ matrix.firmware }}.${ext}" ]; then
              cp "${{ matrix.firmware }}.${ext}" "${{ matrix.firmware }}_${SUFFIX}.${ext}"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.firmware }}_${{ matrix.platform }}_${{ matrix.audio }}
          path: |
            firmware/${{ matrix.firmware }}/build/*_${{ matrix.platform }}_${{ matrix.audio }}.uf2
            firmware/${{ matrix.firmware }}/build/*_${{ matrix.platform }}_${{ matrix.audio }}.bin
            firmware/${{ matrix.firmware }}/build/*_${{ matrix.platform }}_${{ matrix.audio }}.elf
