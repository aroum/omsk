[project]
name = "desktop-simulations"
version = "0.1.0"
description = "Desktop simulations, emulators, and development tools for OMSK Synth, Grain, and MIDI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.2",
    "pyside6>=6.10.1",
    "scipy>=1.17.0",
    "sounddevice>=0.5.5",
    "matplotlib>=3.10.8",
    "mido>=1.3.3",
    "soundfile>=0.12.1",
    "python-rtmidi>=1.5.8",
    "gradio>=6.10.0",
    "pyserial>=3.5",
    "rich>=13.0.0",
]

